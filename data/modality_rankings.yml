# data/modality_rankings.yml
# This file centralizes the logical ordering of categorical modalities for report plots.
# If a plot label or a shared ranking key is defined here, the plotting functions
# (make_bar_obs, ror_bar_grouped, etc.) will use this order instead of the default
# decreasing frequency.

# --- Shared Rankings (can be reused by multiple plots) ---
_shared:
  age_groups:
    - "71 ans et plus"
    - "61-70 ans"
    - "51-60 ans"
    - "41-50 ans"
    - "31-40 ans"
    - "21-30 ans"
    - "11-20 ans"
    - "0-10 ans"

  sanitation_levels:
    - "Dans la nature"
    - "Fosse perdue en commun"
    - "Fosse septique en commun"
    - "Fosse septique en individuel"
    - "Fosse perdue en individuel"
  education_levels:
    - "Non scolarisé"
    - "Primaire"
    - "Secondaire 1er cycle"
    - "Secondaire 2ème cycle & sup"
    - "Inconnu"

# --- Plot-specific Rankings ---
# Keys should match Quarto chunk labels
fig-latrine:
  ranking_key: "sanitation_levels"

fig-statut-logement:
  order:
    - "Propriétaire"
    - "Locataire"
    - "Logé gratuitement"
    - "Prête"
    - "Autre"

fig_homeland:
  order:
    - "Dans le fokontany"
    - "Dans la commune"
    - "Hors de la commune"

fig_cm_educ:
  ranking_key: "education_levels"
  
fig_pyramide:
  ranking_key: "age_groups"